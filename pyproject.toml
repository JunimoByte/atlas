[project]
name = "atlas"
version = "1.0.0"
description = "Atlas is a browser profile backup application."
requires-python = ">=3.8"
authors = [{ name = "Michael Dorman" }]
license = { text = "AGPL-3.0-or-later" }
readme = "README.md"
keywords = ["backup", "browser", "profiles"]

classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent"
]

[project.optional-dependencies]
gui = [
    "pyinstaller>=6.0"
]

dev = [
    "pytest>=8.0",
    "ruff>=0.6.0",
    "black>=24.0.0",
    "flake8>=7.0.0"
]

[project.scripts]
atlas = "atlas.main:main"

[tool.pytest.ini_options]
testpaths = ["src/atlas/tests/unit"]
pythonpath = ["src"]

[tool.setuptools.package-data]
atlas = ["configs/*.json", "configs/*.yaml", "configs/*.yml"]

[tool.ruff]
target-version = "py38"
line-length = 79
src = ["src"]
exclude = [
    ".git",
    ".pytest_cache",
    ".ruff_cache",
    "venv",
    "build",
    "dist",
]

[tool.ruff.lint]
select = ["E", "W", "D", "F", "I", "N", "C90"]
ignore = [
    "D203", # 1 blank line required before class docstring (conflicts with D211)
    "D213", # Multi-line docstring summary should start at the second line (conflicts with D212)
]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.black]
line-length = 79
target-version = ["py38"]
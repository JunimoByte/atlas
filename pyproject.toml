[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "atlas"
version = "1.2"
description = "Atlas is a browser profile backup application."
requires-python = ">=3.8"
authors = [{ name = "JunimoByte" }]
license = { text = "AGPL-3.0-or-later" }
readme = "README.md"
keywords = ["backup", "browser", "profiles"]
dependencies = [
    # PyQt6 requires Python 3.9+; retain PyQt5 for supported 3.8 hosts.
    "PyQt5>=5.15; python_version < '3.9' and (platform_system == 'Windows' or platform_system == 'Darwin' or platform_system == 'Linux')",
    "PyQt6>=6.0; python_version >= '3.9' and platform_system == 'Windows'",
    # Keep a single macOS-compatible ceiling. PEP 508 evaluates every marker
    # term, so comparing platform_release breaks on non-PEP-440 Linux kernels.
    "PyQt6>=6.0,<6.7.1; python_version >= '3.9' and platform_system == 'Darwin'",
    # Keep Qt 6.7 for the project's broad glibc 2.31 compatibility baseline.
    "PyQt6>=6.0,<6.8; python_version >= '3.9' and platform_system == 'Linux'",
    # BSD and Solaris obtain PyQt from their native package managers. Omitting
    # a PyPI requirement prevents pip from attempting an unsupported build.
]

classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent"
]

[project.urls]
Homepage = "https://junimobyte.github.io/atlas-website/"
Repository = "https://github.com/JunimoByte/atlas"
Issues = "https://github.com/JunimoByte/atlas/issues"
Documentation = "https://github.com/JunimoByte/atlas#readme"

[project.optional-dependencies]
gui = [
    "pyinstaller>=6.0",
]

# Linting and test tools. The runtime Qt binding is declared above.
dev = [
    "pytest>=7.0",
    "pytest-qt>=4.0; platform_system != 'FreeBSD' and platform_system != 'OpenBSD' and platform_system != 'NetBSD' and platform_system != 'DragonFly'",
    "black>=23.0.0",
    "flake8>=5.0.0,<7.0.0; python_version < '3.9'",
    "flake8>=7.0.0; python_version >= '3.9'",
    "ruff>=0.1.0,<0.5.0; python_version < '3.9' and platform_system != 'FreeBSD' and platform_system != 'OpenBSD' and platform_system != 'NetBSD' and platform_system != 'DragonFly' and platform_system != 'SunOS' and platform_system != 'Solaris'",
    "ruff>=0.5.0; python_version >= '3.9' and platform_system != 'FreeBSD' and platform_system != 'OpenBSD' and platform_system != 'NetBSD' and platform_system != 'DragonFly' and platform_system != 'SunOS' and platform_system != 'Solaris'",
]

[project.scripts]
atlas = "atlas.main:main"

[tool.pytest.ini_options]
testpaths = ["src/atlas/tests"]
pythonpath = ["src"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.data-files]
"share/atlas/configs" = [
    "configs/blacklist.json",
    "configs/browsers.json",
    "configs/types.json",
]

[tool.ruff]
target-version = "py38"
line-length = 79
src = ["src"]
exclude = [
    ".git",
    ".pytest_cache",
    ".ruff_cache",
    "venv",
    "build",
    "dist",
]

[tool.ruff.lint]
select = ["E", "W", "D", "F", "I", "N", "C90"]
ignore = [
    "D203", # 1 blank line required before class docstring (conflicts with D211)
    "D213", # Multi-line docstring summary should start at the second line (conflicts with D212)
]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.black]
line-length = 79
target-version = ["py38"]

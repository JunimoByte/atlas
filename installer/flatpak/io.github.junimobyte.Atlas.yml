app-id: io.github.junimobyte.Atlas
runtime: org.kde.Platform
runtime-version: '6.7'
sdk: org.kde.Sdk
command: atlas

finish-args:
  # Display server access (X11, XWayland, Wayland)
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland

  # Filesystem permissions to discover and back up browser profiles
  - --filesystem=host:ro
  # Write access to the user's Downloads directory for backup archives
  - --filesystem=xdg-download

modules:
  - name: atlas
    buildsystem: simple
    build-commands:
      - pip3 install --no-build-isolation --no-deps --prefix=/app .
      - install -Dm755 installer/debian/atlas /app/bin/atlas
      - install -Dm644 assets/icons/Icon.svg
        /app/share/icons/hicolor/scalable/apps/io.github.junimobyte.Atlas.svg
      - install -Dm644 installer/debian/atlas.desktop
        /app/share/applications/io.github.junimobyte.Atlas.desktop
    sources:
      - type: dir
        path: .

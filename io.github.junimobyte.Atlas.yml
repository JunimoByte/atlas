app-id: io.github.junimobyte.Atlas
runtime: org.kde.Platform
runtime-version: '6.8'
sdk: org.kde.Sdk
base: com.riverbankcomputing.PyQt.BaseApp
base-version: '6.8'
command: atlas

finish-args:
  # Display server access (X11, XWayland, Wayland)
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland

  # Filesystem permissions to discover and back up browser profiles
  - --filesystem=host:ro
  - --filesystem=home:ro
  # Write access to the user's Downloads directory for backup archives
  - --filesystem=xdg-download

cleanup-commands:
  - /app/cleanup-BaseApp.sh

build-options:
  env:
    BASEAPP_REMOVE_WEBENGINE: '1'

modules:
  - name: atlas
    buildsystem: simple
    build-commands:
      - pip3 install --no-build-isolation --no-deps --prefix=/app .
      - install -Dm644 assets/icons/Icon.svg
        /app/share/icons/hicolor/scalable/apps/io.github.junimobyte.Atlas.svg
      - install -Dm644 installer/flatpak/io.github.junimobyte.Atlas.desktop
        /app/share/applications/io.github.junimobyte.Atlas.desktop
      - install -Dm644
        installer/flatpak/io.github.junimobyte.Atlas.metainfo.xml
        /app/share/metainfo/io.github.junimobyte.Atlas.metainfo.xml
    sources:
      - type: dir
        path: .

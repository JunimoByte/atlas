name: CI

on:
  push:
    branches: [alpha, beta, main]
  pull_request:
    branches: [alpha, beta, main]
  schedule:
    # Monthly heartbeat test run at 00:00 UTC on the 1st of every month
    - cron: '0 0 1 * *'

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.8"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff
        run: ruff check .

      - name: Flake8
        run: flake8 .

  test:
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          IMAGES=(
            "mcr.microsoft.com/mirror/docker/library/python:3.8-slim"
            "docker.io/library/python:3.8-slim"
            "public.ecr.aws/docker/library/python:3.8-slim"
          )
          BUILT=false
          for img in "${IMAGES[@]}"; do
            echo "Attempting Docker build with base image: $img"
            if docker build --build-arg BASE_IMAGE="$img" -t atlas-tests .; then
              BUILT=true
              break
            fi
            echo "Build with $img failed, trying next mirror..."
          done
          if [ "$BUILT" != "true" ]; then
            echo "Failed to build Docker test image from any mirror." >&2
            exit 1
          fi

      - name: Verify offline Linux payload
        run: >
          docker run --rm --network none atlas-tests
          python -m PyInstaller --noconfirm --clean appimage.spec

      - name: Run tests with networking disabled
        run: docker run --rm --network none atlas-tests

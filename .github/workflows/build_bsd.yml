name: Build FreeBSD Release

on:
  workflow_dispatch:
  push:
    branches:
      - alpha
      - beta
      - main
    tags:
      - 'v*'
    paths:
      - 'src/**'
      - 'assets/**'
      - 'configs/**'
      - 'scripts/install_bsd.sh'
      - 'main.spec'
      - 'pyproject.toml'
      - '.github/workflows/build_bsd.yml'

jobs:
  build-freebsd:
    name: Build FreeBSD 13 x86_64
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build in FreeBSD 13 VM
        uses: vmactions/freebsd-vm@v1
        with:
          release: '13.4'
          usesh: true
          prepare: |
            export ASSUME_ALWAYS_YES=yes
            pkg bootstrap -f
            pkg update -f
            pkg install -y python311 py311-pip bash
            ln -sf /usr/local/bin/python3.11 /usr/local/bin/python3 || true
            ln -sf /usr/local/bin/python3.11 /usr/local/bin/python || true
            pkg install -y py311-qt6-pyqt || pkg install -y py311-PyQt6
            pkg install -y py311-pyinstaller || python3.11 -m pip install pyinstaller
          run: |
            set -e

            # 1. Compile single-file portable binary
            python3.11 -m PyInstaller main.spec --noconfirm --clean

            # 2. Verify binary existence and permissions
            if [ ! -f "dist/Atlas-x86_64-Portable" ]; then
              echo "Build failure: dist/Atlas-x86_64-Portable was not generated." >&2
              exit 1
            fi
            chmod +x dist/Atlas-x86_64-Portable

            # 3. Stage the portable release bundle
            rm -rf dist/FreeBSD_Release
            mkdir -p dist/FreeBSD_Release
            cp -p dist/Atlas-x86_64-Portable dist/FreeBSD_Release/
            cp -p assets/icons/Icon.svg dist/FreeBSD_Release/
            cp -p scripts/install_bsd.sh dist/FreeBSD_Release/
            chmod +x dist/FreeBSD_Release/install_bsd.sh

            # 4. Package as tar archive
            cd dist
            tar -cvf Atlas-FreeBSD13-x86_64.tar FreeBSD_Release/

      - name: Upload FreeBSD Release Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Atlas-FreeBSD13-x86_64
          path: dist/Atlas-FreeBSD13-x86_64.tar
          if-no-files-found: error
          retention-days: 14

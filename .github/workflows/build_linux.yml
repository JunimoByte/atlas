name: Build Linux Release

on:
  workflow_dispatch:
  push:
    branches:
      - alpha
      - beta
      - main
    tags:
      - 'v*'
    paths:
      - 'src/**'
      - 'assets/**'
      - 'configs/**'
      - 'installer/appimage/**'
      - 'installer/debian/**'
      - 'scripts/build_appimage.sh'
      - 'scripts/build_deb.sh'
      - 'appimage.spec'
      - 'pyproject.toml'
      - '.github/workflows/build_linux.yml'

jobs:
  build-linux:
    name: Build Linux x86_64 (AppImage & DEB)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build AppImage and DEB in Ubuntu 20.04
        run: |
          docker run --rm \
            -v "$PWD:/workspace" \
            -w /workspace \
            ubuntu:20.04 \
            bash -c '
              set -e
              export DEBIAN_FRONTEND=noninteractive

              # 1. System packages & XCB runtime dependencies
              apt-get update
              apt-get install -y \
                python3 \
                python3-pip \
                python3-venv \
                binutils \
                dpkg-dev \
                curl \
                git \
                file \
                ca-certificates \
                libdbus-1-3 \
                libgl1 \
                libglib2.0-0 \
                libglib2.0-bin \
                gsettings-desktop-schemas \
                dconf-gsettings-backend \
                libfontconfig1 \
                libxrender1 \
                libxext6 \
                libsm6 \
                libx11-6 \
                libx11-xcb1 \
                libxkbcommon0 \
                libegl1 \
                libopengl0 \
                libxcb-cursor0 \
                libxcb1 \
                libxcb-icccm4 \
                libxcb-image0 \
                libxcb-keysyms1 \
                libxcb-randr0 \
                libxcb-render-util0 \
                libxcb-shape0 \
                libxcb-xinerama0 \
                libxcb-xkb1 \
                libxkbcommon-x11-0

              # 2. Virtual environment & Qt binding (matches setup_dev.sh)
              python3 -m venv /opt/venv
              . /opt/venv/bin/activate
              pip install --upgrade pip
              if ! pip install "PyQt6>=6.0"; then
                pip install "PyQt5>=5.15"
              fi
              pip install "pyinstaller>=6.0"

              # 3. AppImage packaging tool
              TOOL_BASE="https://github.com/AppImage/appimagetool/releases"
              TOOL_FILE="appimagetool-x86_64.AppImage"
              curl -fsSL -o /usr/local/bin/appimagetool \
                "${TOOL_BASE}/download/continuous/${TOOL_FILE}"
              chmod +x /usr/local/bin/appimagetool

              # 4. Build AppImage & Debian package inside venv
              bash scripts/build_appimage.sh
              bash scripts/build_deb.sh

              # 5. Fix permissions for host runner
              chmod -R a+rX dist/
            '

      - name: Upload Linux Release Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Atlas-Linux-x86_64
          path: |
            dist/Atlas-x86_64.AppImage
            dist/Atlas-x86_64.deb
          if-no-files-found: error
          retention-days: 14

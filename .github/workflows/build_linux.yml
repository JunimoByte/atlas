name: Build Linux Release

on:
  workflow_dispatch:
  push:
    branches:
      - alpha
      - beta
      - main
    tags:
      - 'v*'
    paths:
      - 'src/**'
      - 'assets/**'
      - 'configs/**'
      - 'installer/appimage/**'
      - 'installer/debian/**'
      - 'scripts/build_appimage.sh'
      - 'scripts/build_deb.sh'
      - 'appimage.spec'
      - 'pyproject.toml'
      - '.github/workflows/build_linux.yml'

jobs:
  build-linux:
    name: Build Linux x86_64 (AppImage & DEB)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build AppImage and DEB in Ubuntu 20.04
        run: |
          docker run --rm \
            -v "$PWD:/workspace" \
            -w /workspace \
            ubuntu:20.04 \
            bash -c '
              set -e
              export DEBIAN_FRONTEND=noninteractive

              # 1. System packages, GTK theme libs & XCB dependencies
              git config --global --add safe.directory /workspace || true
              apt-get update
              apt-get install -y \
                python3 \
                python3-pip \
                python3-venv \
                python3-dev \
                python-is-python3 \
                build-essential \
                pkg-config \
                binutils \
                dpkg-dev \
                curl \
                git \
                file \
                ca-certificates \
                libdbus-1-3 \
                libdbus-1-dev \
                libgl1 \
                libgl1-mesa-dev \
                libglib2.0-0 \
                libglib2.0-bin \
                libglib2.0-dev \
                gsettings-desktop-schemas \
                dconf-gsettings-backend \
                dconf-cli \
                libgtk-3-0 \
                libgtk-3-dev \
                libgdk-pixbuf2.0-0 \
                libgdk-pixbuf2.0-dev \
                librsvg2-common \
                adwaita-icon-theme \
                gnome-themes-extra \
                libfontconfig1 \
                libfontconfig1-dev \
                libfreetype6 \
                libfreetype6-dev \
                libxrender1 \
                libxrender-dev \
                libxext6 \
                libxext-dev \
                libsm6 \
                libice6 \
                libx11-6 \
                libx11-dev \
                libx11-xcb1 \
                libx11-xcb-dev \
                libxkbcommon0 \
                libxkbcommon-dev \
                libxkbcommon-x11-0 \
                libxkbcommon-x11-dev \
                libegl1 \
                libegl1-mesa-dev \
                libopengl0 \
                libxcb-cursor0 \
                libxcb-cursor-dev \
                libxcb1 \
                libxcb1-dev \
                libxcb-icccm4 \
                libxcb-icccm4-dev \
                libxcb-image0 \
                libxcb-image0-dev \
                libxcb-keysyms1 \
                libxcb-keysyms1-dev \
                libxcb-randr0 \
                libxcb-randr0-dev \
                libxcb-render-util0 \
                libxcb-render-util0-dev \
                libxcb-shape0 \
                libxcb-shape0-dev \
                libxcb-xinerama0 \
                libxcb-xinerama0-dev \
                libxcb-xkb1 \
                libxcb-xkb-dev \
                shared-mime-info \
                desktop-file-utils
              ldconfig

              # 2. Setup dev environment (matches VM build)
              source scripts/setup_dev.sh

              # 3. AppImage packaging tool
              TOOL_BASE="https://github.com/AppImage/appimagetool/releases"
              TOOL_FILE="appimagetool-x86_64.AppImage"
              curl -fsSL -o /usr/local/bin/appimagetool \
                "${TOOL_BASE}/download/continuous/${TOOL_FILE}"
              chmod +x /usr/local/bin/appimagetool

              # 4. Build AppImage & Debian package inside venv
              bash scripts/build_appimage.sh
              bash scripts/build_deb.sh

              # 5. Fix permissions for host runner & inspect output
              ls -lh dist/
              chmod -R a+rX dist/
              rm -rf venv build
            '

      - name: Upload Linux Release Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Atlas-Linux-x86_64
          path: |
            dist/Atlas-x86_64.AppImage
            dist/Atlas-x86_64.deb
          if-no-files-found: error
          retention-days: 14
